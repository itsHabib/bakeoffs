name: durable-workflows
version: 0.1.0.0
github: itsHabib/bakeoff
license: MIT

ghc-options:
  - -Wall
  - -Werror

dependencies:
  - base >= 4.18 && < 5

library:
  source-dirs: src

executables:
  durable-workflows:
    main: Main.hs
    source-dirs: app
    dependencies:
      - durable-workflows

tests:
  durable-workflows-test:
    main: Spec.hs
    source-dirs: test
    dependencies:
      - durable-workflows
