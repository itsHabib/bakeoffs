name: capability-plans
version: 0.1.0.0
github: itsHabib/bakeoff
license: MIT

ghc-options:
  - -Wall
  - -Werror

dependencies:
  - base >= 4.18 && < 5
  - containers

library:
  source-dirs: src

executables:
  capability-plans:
    main: Main.hs
    source-dirs: app
    dependencies:
      - capability-plans

tests:
  capability-plans-test:
    main: Spec.hs
    source-dirs: test
    dependencies:
      - capability-plans
