version: "2"
linters:
  enable:
    - cyclop
    - gocognit
    - nestif
    - revive
  settings:
    cyclop:
      max-complexity: 12
    gocognit:
      min-complexity: 15
    nestif:
      min-complexity: 4
    errcheck:
      # Terminal output: a failed write to stdout/stderr has no better handler.
      exclude-functions:
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Fprint
